<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosco - Cuenta Corriente / Fiados</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --dark: #1f2937;
            --background: #f3f4f6;
            --card: #ffffff;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            margin: 0;
            padding: 15px;
            color: var(--dark);
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
        }
        h2 { text-align: center; color: #1e3a8a; }
        .card {
            background: var(--card);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            font-size: 14px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover { background-color: #1d4ed8; }
        .btn-pay { background-color: var(--success); width: auto; padding: 6px 12px; font-size: 13px; margin-top: 0;}
        .btn-delete { background-color: var(--danger); width: auto; padding: 4px 8px; font-size: 12px; margin-top: 0;}
        
        .dashboard {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            text-align: center;
        }
        .stat-box {
            background: var(--card);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .stat-box h3 { margin: 0; font-size: 14px; color: #6b7280; }
        .stat-box p { margin: 5px 0 0 0; font-size: 24px; font-weight: bold; color: var(--danger); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e5e7eb; }
        
        details {
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        summary {
            font-weight: bold;
            cursor: pointer;
            list-style: none;
        }
        .cliente-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .cliente-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 8px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏪 Kiosco - Cuentas Corrientes</h2>

    <!-- Resumen -->
    <div class="dashboard">
        <div class="stat-box">
            <h3>Total en la Calle (Fiados acumulados)</h3>
            <p id="totalDebt">$0.00</p>
        </div>
    </div>

    <!-- Administrar Productos -->
    <div class="card" style="margin-top: 15px;">
        <details>
            <summary>⚙️ Administrar mis productos</summary>
            <form id="productForm" class="grid-3" style="margin-top: 10px; align-items: end;">
                <div>
                    <label>Nombre</label>
                    <input type="text" id="newProdName" placeholder="Ej: Sándwich" required>
                </div>
                <div>
                    <label>Costo</label>
                    <input type="number" step="0.01" id="newProdCost" placeholder="Ej: 500" required>
                </div>
                <div>
                    <label>Precio Venta</label>
                    <input type="number" step="0.01" id="newProdPrice" placeholder="Ej: 1000" required>
                </div>
            </form>
            <button type="submit" form="productForm" style="background-color: var(--dark);">+ Agregar Producto</button>

            <table style="margin-top: 15px;">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Borrar</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody"></tbody>
            </table>
        </details>
    </div>

    <!-- Anotar Consumo Diario -->
    <div class="card">
        <h3 style="margin-top: 0;">📝 Anotar Consumo Diario (Fiado)</h3>
        <form id="consumeForm">
            <label>Nombre del Comprador (Cliente)</label>
            <input type="text" id="buyerName" placeholder="Ej: Cholo, Ferri, Bicho..." required>

            <div class="grid-2">
                <div>
                    <label>Producto</label>
                    <select id="productSelect" required></select>
                </div>
                <div>
                    <label>Cantidad</label>
                    <input type="number" id="qty" value="1" min="1" required>
                </div>
            </div>

            <button type="submit">Anotar en la Cuenta</button>
        </form>
    </div>

    <!-- Cuentas por Cliente (Resumen del Mes) -->
    <div class="card">
        <h3 style="margin-top: 0;">👥 Cuentas de Clientes (Cobro a Fin de Mes)</h3>
        <div id="clientesContainer">
            <p style="text-align: center; color: #6b7280;">No hay deudas registradas.</p>
        </div>
    </div>
</div>

<script>
    let productos = [];
    let cuentas = [];

    async function cargarDatos() {
        try {
            const res = await fetch('/api/datos');
            const data = await res.json();
            productos = data.productos;
            cuentas = data.cuentas;
            renderizarTodo();
        } catch (err) {
            console.error("Error al cargar datos:", err);
        }
    }

    // Agregar Producto
    document.getElementById('productForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const nombre = document.getElementById('newProdName').value;
        const costo = document.getElementById('newProdCost').value;
        const precio = document.getElementById('newProdPrice').value;

        await fetch('/api/productos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, costo, precio })
        });

        document.getElementById('productForm').reset();
        cargarDatos();
    });

    async function borrarProducto(id) {
        if (confirm('¿Seguro querés borrar este producto?')) {
            await fetch(`/api/productos/${id}`, { method: 'DELETE' });
            cargarDatos();
        }
    }

    // Registrar Consumo Diario
    document.getElementById('consumeForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const cliente = document.getElementById('buyerName').value.trim();
        const prodId = document.getElementById('productSelect').value;
        const qty = parseInt(document.getElementById('qty').value);

        const producto = productos.find(p => p.id == prodId);
        if (!producto) return;

        const montoTotal = producto.precio * qty;
        const detalle = `${qty}x ${producto.nombre}`;

        await fetch('/api/cuentas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cliente, detalle, monto: montoTotal })
        });

        document.getElementById('consumeForm').reset();
        document.getElementById('qty').value = 1;
        cargarDatos();
    });

    // Pagar la cuenta total de un cliente
    async function cobrarCliente(cliente) {
        if (confirm(`¿Confirmás que ${cliente} pagó todo el mes? Se cerrará su cuenta.`)) {
            await fetch(`/api/cuentas/pagar/${encodeURIComponent(cliente)}`, { method: 'PUT' });
            cargarDatos();
        }
    }

    // Borrar un item suelto
    async function borrarItem(id) {
        if (confirm('¿Borrar este consumo individual?')) {
            await fetch(`/api/cuentas/${id}`, { method: 'DELETE' });
            cargarDatos();
        }
    }

    function renderizarTodo() {
        // 1. Renderizar productos en select y tabla
        const select = document.getElementById('productSelect');
        const pTable = document.getElementById('productsTableBody');
        select.innerHTML = '';
        pTable.innerHTML = '';

        productos.forEach(p => {
            select.innerHTML += `<option value="${p.id}">${p.name || p.nombre} - $${p.precio}</option>`;
            pTable.innerHTML += `
                <tr>
                    <td>${p.nombre}</td>
                    <td>$${p.precio}</td>
                    <td><button class="btn-delete" onclick="borrarProducto(${p.id})">🗑️</button></td>
                </tr>
            `;
        });

        // 2. Filtrar deudas pendientes (no pagadas)
        const pendientes = cuentas.filter(c => !c.pagado);

        // Calcular total en la calle
        const totalCalle = pendientes.reduce((acc, curr) => acc + parseFloat(curr.monto), 0);
        document.getElementById('totalDebt').innerText = '$' + totalCalle.toFixed(2);

        // Agrupar por cliente
        const porCliente = {};
        pendientes.forEach(c => {
            if (!porCliente[c.cliente]) porCliente[c.cliente] = [];
            porCliente[c.cliente].push(c);
        });

        const clientesContainer = document.getElementById('clientesContainer');
        clientesContainer.innerHTML = '';

        const nombresClientes = Object.keys(porCliente);
        if (nombresClientes.length === 0) {
            clientesContainer.innerHTML = '<p style="text-align: center; color: #6b7280;">No hay deudas pendientes en este momento. ¡Todo al día!</p>';
            return;
        }

        nombresClientes.forEach(cliente => {
            const items = porCliente[cliente];
            let subtotalCliente = 0;

            let htmlItems = '';
            items.forEach(item => {
                subtotalCliente += parseFloat(item.monto);
                const fechaCorta = new Date(item.fecha).toLocaleDateString();
                htmlItems += `
                    <tr>
                        <td><small>${fechaCorta}</small><br>${item.detalle}</td>
                        <td><strong>$${item.monto}</strong></td>
                        <td><button class="btn-delete" onclick="borrarItem(${item.id})">❌</button></td>
                    </tr>
                `;
            });

            clientesContainer.innerHTML += `
                <div class="cliente-card">
                    <div class="cliente-header">
                        <div>
                            <strong style="font-size: 18px; color: #1e3a8a;">👤 ${cliente}</strong><br>
                            <span style="color: var(--danger); font-weight: bold; font-size: 16px;">Debe total: $${subtotalCliente.toFixed(2)}</span>
                        </div>
                        <button class="btn-pay" onclick="cobrarCliente('${cliente}')">💰 Cobrar Mes</button>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Día / Detalle</th>
                                <th>Monto</th>
                                <th>Quitar</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${htmlItems}
                        </tbody>
                    </table>
                </div>
            `;
        });
    }

    cargarDatos();
</script>

</body>
</html>
