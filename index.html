<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Ventas</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --dark: #1f2937;
            --background: #f3f4f6;
            --card: #ffffff;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            margin: 0;
            padding: 15px;
            color: var(--dark);
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h2 { text-align: center; }
        .card {
            background: var(--card);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            font-size: 14px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover { background-color: #1d4ed8; }
        .btn-pay { background-color: var(--success); width: auto; padding: 5px 10px; font-size: 12px; margin-top: 0;}
        .btn-delete { background-color: var(--danger); width: auto; padding: 5px 10px; font-size: 12px; margin-top: 0;}
        .btn-add-product { background-color: var(--dark); margin-top: 24px; padding: 10px;}
        
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            text-align: center;
        }
        .stat-box {
            background: var(--card);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .stat-box h3 { margin: 0; font-size: 14px; color: #6b7280; }
        .stat-box p { margin: 5px 0 0 0; font-size: 20px; font-weight: bold; }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e5e7eb; }
        .badge-deuda { background: #fee2e2; color: #991b1b; padding: 3px 6px; border-radius: 4px; font-size: 12px;}
        .badge-pagado { background: #dcfce3; color: #166534; padding: 3px 6px; border-radius: 4px; font-size: 12px;}
        
        details {
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        summary {
            font-weight: bold;
            cursor: pointer;
            list-style: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🥤 Mis Ventas</h2>

    <!-- Resumen -->
    <div class="dashboard" id="dashboard">
        <div class="stat-box">
            <h3>Ganancia Total</h3>
            <p class="text-success" id="totalProfit">$0</p>
        </div>
        <div class="stat-box">
            <h3>Plata en la Calle</h3>
            <p class="text-danger" id="totalDebt">$0</p>
        </div>
    </div>

    <!-- Gestión de Productos (Desplegable) -->
    <div class="card" style="margin-top: 15px;">
        <details>
            <summary>⚙️ Administrar mis productos</summary>
            
            <form id="productForm" class="grid-3" style="margin-top: 10px; align-items: end;">
                <div>
                    <label>Nombre</label>
                    <input type="text" id="newProdName" placeholder="Ej: Empanada" required>
                </div>
                <div>
                    <label>Costo</label>
                    <input type="number" step="0.01" id="newProdCost" placeholder="Ej: 300" required>
                </div>
                <div>
                    <label>Precio Venta</label>
                    <input type="number" step="0.01" id="newProdPrice" placeholder="Ej: 500" required>
                </div>
            </form>
            <button type="submit" form="productForm" class="btn-add-product">+ Agregar Producto</button>

            <div style="overflow-x: auto; margin-top: 15px;">
                <table>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Costo / Venta</th>
                            <th>Borrar</th>
                        </tr>
                    </thead>
                    <tbody id="productsList">
                        <!-- Productos cargados acá -->
                    </tbody>
                </table>
            </div>
        </details>
    </div>

    <!-- Formulario de Venta -->
    <div class="card">
        <h3 style="margin-top: 0;">Nueva Venta</h3>
        <form id="saleForm">
            <label>Producto</label>
            <select id="productSelect" required>
                <!-- Opciones se cargan automáticamente -->
            </select>

            <div class="grid-2">
                <div>
                    <label>Cantidad</label>
                    <input type="number" id="qty" value="1" min="1" required>
                </div>
                <div>
                    <label>Estado</label>
                    <select id="status">
                        <option value="debe">Me debe (Fiado)</option>
                        <option value="pagado">Ya pagó</option>
                    </select>
                </div>
            </div>

            <label>Nombre del comprador (Como en el grupo de WhatsApp)</label>
            <input type="text" id="buyer" placeholder="Ej: Ferri, Cholo, Bicho..." required>

            <button type="submit">Registrar Venta</button>
        </form>
    </div>

    <!-- Lista de Ventas -->
    <div class="card">
        <h3 style="margin-top: 0;">Registro Histórico</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Detalle</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="salesList">
                    <!-- Las ventas aparecen acá -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // 1. BASE DE DATOS DE PRODUCTOS INICIALES
    const defaultProducts = [
        { id: '1', name: 'Coca-Cola', cost: 1266.66, price: 2500 },
        { id: '2', name: 'Fanta/Sprite', cost: 1066.66, price: 2300 },
        { id: '3', name: 'Agua saborizada', cost: 659, price: 1500 },
        { id: '4', name: 'Alfajor', cost: 290, price: 600 },
        { id: '5', name: 'Pizza', cost: 0, price: 0 },
        { id: '6', name: 'Mila de carne', cost: 0, price: 0 },
        { id: '7', name: 'Mila de pollo', cost: 0, price: 0 },
        { id: '8', name: 'Sándwich de Miga', cost: 0, price: 0 },
        { id: '9', name: 'Monster', cost: 0, price: 0 },
        { id: '10', name: 'Jugo Placer', cost: 0, price: 0 },
        { id: '11', name: 'Chicles', cost: 0, price: 0 },
        { id: '12', name: 'Diversión', cost: 0, price: 0 }
    ];

    // Cargar datos guardados en el navegador
    let products = JSON.parse(localStorage.getItem('ventasAppProductos')) || defaultProducts;
    let sales = JSON.parse(localStorage.getItem('ventasAppDatos')) || [];

    // Referencias a la interfaz
    const saleForm = document.getElementById('saleForm');
    const productForm = document.getElementById('productForm');
    
    // --- LÓGICA DE PRODUCTOS ---
    
    // Agregar un producto nuevo
    productForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const newProduct = {
            id: Date.now().toString(),
            name: document.getElementById('newProdName').value,
            cost: parseFloat(document.getElementById('newProdCost').value),
            price: parseFloat(document.getElementById('newProdPrice').value)
        };

        products.push(newProduct);
        saveProductsData();
        renderProducts();
        productForm.reset();
        alert("¡Producto agregado con éxito!");
    });

    // Borrar un producto
    function deleteProduct(id) {
        if(confirm('¿Seguro que querés borrar este producto de la lista?')) {
            products = products.filter(p => p.id !== id);
            saveProductsData();
            renderProducts();
        }
    }

    function saveProductsData() {
        localStorage.setItem('ventasAppProductos', JSON.stringify(products));
    }

    // Dibujar la lista desplegable y la tabla de productos
    function renderProducts() {
        const select = document.getElementById('productSelect');
        const list = document.getElementById('productsList');
        
        select.innerHTML = '';
        list.innerHTML = '';

        products.forEach(p => {
            // Llenar el combo de ventas
            select.innerHTML += `<option value="${p.id}">${p.name} (Venta: $${p.price})</option>`;
            
            // Llenar la tabla de administración
            list.innerHTML += `
                <tr>
                    <td><strong>${p.name}</strong></td>
                    <td>Costo: $${p.cost}<br>Venta: $${p.price}</td>
                    <td><button class="btn-delete" onclick="deleteProduct('${p.id}')">🗑️</button></td>
                </tr>
            `;
        });
    }

    // --- LÓGICA DE VENTAS ---
    
    // Registrar Venta
    saleForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const prodId = document.getElementById('productSelect').value;
        const qty = parseInt(document.getElementById('qty').value);
        const buyer = document.getElementById('buyer').value;
        const status = document.getElementById('status').value;
        
        const product = products.find(p => p.id === prodId);
        const totalVenta = product.price * qty;
        const ganancia = (product.price - product.cost) * qty;

        const newSale = {
            id: Date.now(),
            date: new Date().toLocaleDateString(),
            buyer: buyer,
            productName: product.name,
            qty: qty,
            total: totalVenta,
            profit: ganancia,
            isPaid: status === 'pagado'
        };

        sales.unshift(newSale); // Agregar al principio
        saveSalesData();
        renderSales();
        
        document.getElementById('buyer').value = '';
        document.getElementById('qty').value = 1;
    });

    function saveSalesData() {
        localStorage.setItem('ventasAppDatos', JSON.stringify(sales));
    }

    function markAsPaid(id) {
        const sale = sales.find(s => s.id === id);
        if (sale) {
            sale.isPaid = true;
            saveSalesData();
            renderSales();
        }
    }

    function deleteSale(id) {
        if(confirm('¿Seguro que querés borrar esta venta?')) {
            sales = sales.filter(s => s.id !== id);
            saveSalesData();
            renderSales();
        }
    }

    // Dibujar la interfaz de ventas
    function renderSales() {
        const salesList = document.getElementById('salesList');
        salesList.innerHTML = '';
        let totalProfit = 0;
        let totalDebt = 0;

        sales.forEach(sale => {
            if (sale.isPaid) {
                totalProfit += sale.profit;
            } else {
                totalDebt += sale.total;
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${sale.buyer}</strong><br><small>${sale.date}</small></td>
                <td>${sale.qty}x ${sale.productName}<br><b>$${sale.total}</b></td>
                <td>
                    <span class="${sale.isPaid ? 'badge-pagado' : 'badge-deuda'}">
                        ${sale.isPaid ? 'Pagado' : 'Debe'}
                    </span>
                </td>
                <td>
                    ${!sale.isPaid ? `<button class="btn-pay" onclick="markAsPaid(${sale.id})">Cobrar</button>` : ''}
                    <button class="btn-delete" onclick="deleteSale(${sale.id})">🗑️</button>
                </td>
            `;
            salesList.appendChild(tr);
        });

        document.getElementById('totalProfit').innerText = '$' + totalProfit.toFixed(2);
        document.getElementById('totalDebt').innerText = '$' + totalDebt.toFixed(2);
    }

    // Iniciar la app cargando todo
    renderProducts();
    renderSales();
</script>

</body>
</html>
